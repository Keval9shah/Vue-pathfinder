<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Code Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .editor-container {
                flex-direction: row;
            }
        }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        .editor-header {
            background-color: #4b5563;
            color: #ffffff;
            padding: 0.5rem 1rem;
            font-weight: 500;
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 1rem;
            border: none;
            outline: none;
            resize: none;
            font-family: monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            background-color: #f9fafb;
            color: #1f2937;
        }

        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <main class="editor-container">
        <!-- Editors -->
        <div class="flex flex-col md:flex-row flex-1 gap-4">
            <!-- HTML Editor (hidden) -->
            <div class="editor-panel flex-1 hidden">
                <div class="editor-header">HTML</div>
                <textarea id="html-editor" placeholder="Write your HTML here..."></textarea>
            </div>

            <!-- CSS Editor (hidden) -->
            <div class="editor-panel flex-1 hidden">
                <div class="editor-header">CSS</div>
                <textarea id="css-editor" placeholder="Write your CSS here..."></textarea>
            </div>

            <!-- JavaScript Editor -->
            <div class="editor-panel flex-1">
                <div class="editor-header">JavaScript</div>
                <textarea id="js-editor" placeholder="Write your JavaScript here..."></textarea>
            </div>
        </div>

        <!-- Live Preview -->
        <div class="preview-panel">
            <div class="editor-header">Live Preview</div>
            <iframe id="live-preview"></iframe>
        </div>
    </main>

    <script>
        // Get references to the editor textareas and the preview iframe
        const htmlEditor = document.getElementById('html-editor');
        const cssEditor = document.getElementById('css-editor');
        const jsEditor = document.getElementById('js-editor');
        const preview = document.getElementById('live-preview');

        // Initial HTML template
        const initialHTML = `
<h1>Hello, Gemini!</h1>
<p>You can edit this text and see the changes instantly.</p>
<button id="myButton">Click me!</button>
`;
        // Initial CSS template
        const initialCSS = `
body {
    background-color: #e5e7eb;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    color: #1f2937;
    font-family: 'Inter', sans-serif;
}
.container {
    text-align: center;
    padding: 2rem;
    background-color: #ffffff;
    border-radius: 0.75rem;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}
h1 {
    font-size: 2rem;
    font-weight: 700;
}
button {
    background-color: #2563eb;
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s;
}
`;
        // Initial JavaScript to get you started
        const initialJS = `
document.getElementById('myButton').addEventListener('click', () => {
    alert('Button clicked!');
});
`;

        // Function to update the iframe with the code from all three editors
        const updatePreview = () => {
            const htmlContent = htmlEditor.value;
            const cssContent = cssEditor.value;
            const jsContent = jsEditor.value;

            // Construct the full HTML document with inline CSS and JS
            const fullHtml = `
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Live Preview</title>
    <style>${cssContent}</style>
</head>
<body>
    <div class="container">${htmlContent}</div>
    <script>${jsContent}<\/script>
</body>
</html>
            `;

            const iframeDocument = preview.contentDocument || preview.contentWindow.document;
            iframeDocument.open();
            iframeDocument.write(fullHtml);
            iframeDocument.close();
        };

        // Set the initial code in each editor on page load
        htmlEditor.value = initialHTML.trim();
        cssEditor.value = initialCSS.trim();
        jsEditor.value = initialJS.trim();

        // Update the preview immediately
        updatePreview();

        // Add event listeners to each editor for real-time updates
        htmlEditor.addEventListener('input', updatePreview);
        cssEditor.addEventListener('input', updatePreview);
        jsEditor.addEventListener('input', updatePreview);
    </script>
</body>
</html>
